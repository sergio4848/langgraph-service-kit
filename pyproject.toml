[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service-kit"
version = "0.1.0"
description = "Reusable FastAPI service for LangGraph agents: structured outputs, a deterministic backend for tests and CI, an evaluation harness, Prometheus metrics, Docker and Kubernetes manifests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergen Şahin" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-eval = "agent_service.evals.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_service = ["knowledge/*.json", "evals/*.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
