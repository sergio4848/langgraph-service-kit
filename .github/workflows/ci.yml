name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Offline evaluation (rules backend)
        run: agent-eval --backend rules --out evals/results
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: evals/results/*.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agent-service-kit:ci
      - name: Smoke test the image
        run: |
          docker run -d --rm --name kit -p 8000:8000 -e AGENT_BACKEND=rules agent-service-kit:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/readyz && break || sleep 1; done
          curl -fsS -X POST http://localhost:8000/v1/triage -H 'content-type: application/json' \
            -d '{"text":"My bike was stolen from the station, policy CT-0099882"}' | tee out.json
          grep -q '"outcome":"answered"' out.json
          docker stop kit
